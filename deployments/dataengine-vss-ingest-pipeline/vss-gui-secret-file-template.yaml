vss2-secret:
  # ============================================================================
  # S3 SETTINGS
  # ============================================================================
  # Used by: video-segmenter, video-reasoner, video-embedder (S3 download for visual embeddings)
  s3accesskey: ""
  s3secretkey: ""
  s3endpoint: "http://"
  
  # ============================================================================
  # COSMOS REASON2 (vLLM on host port 8001)
  # ============================================================================
  # Example: docker run ... vllm-openai --port 8001 --served-model-name "./Cosmos-Reason2-8B"
  cosmos_host: ""   # IP reachable from DataEngine workers; or hostname/path/prefix for routed APIs
  cosmos_port: 8001
  cosmoshttpscheme: "http"
  # cosmos_authorization: ""  # optional Bearer token for hosted Cosmos APIs
  cosmos_model: "./Cosmos-Reason2-8B"
  cosmos_max_tokens: 6000
  cosmos_temperature: 0.2
  
  # ============================================================================
  # COSMOS-EMBED1 NIM (host port 8002 → container 8000)
  # ============================================================================
  # Example: docker run -p 8002:8000 nvcr.io/nim/nvidia/cosmos-embed1:1.1.0
  embedding_local_nim: true
  embeddinghost: ""        # same host as Reason2, reachable from DataEngine
  embeddingport: 8002
  embeddinghttpscheme: "http"
  embeddingmodel: "nvidia/cosmos-embed1"
  embeddingdimensions: 256   # Cosmos-Embed1 output size (NOT 2048)
  nvidia_api_key: "nvapi-xxx"   # not sent when embedding_local_nim: true

  # Visual vectors: same Cosmos-Embed1 NIM, embeds full segment MP4
  visual_embedding_enabled: true
  visual_embedding_model: "nvidia/cosmos-embed1"
  visual_embedding_dimensions: 256

  # Perception lite (optional extra Reason2 call — NOT object detection)
  perception_max_tokens: 512
  
  # ============================================================================
  # VIDEO REASONER SETTINGS
  # ============================================================================
  max_video_size_mb: 100
  scenario: "general"
  
  # ============================================================================
  # VASTDB SETTINGS
  # ============================================================================
  vdbendpoint: "http://"
  vdbbucket: "vss-db"
  vdbschema: "vss-schema"
  vdbaccesskey: ""
  vdbsecretkey: ""
  vdbcollection: "vss-collection"
  
  # ============================================================================
  # PROMPT SUGGESTER (DataEngine: prompt-suggester — same vss2-secret)
  # ============================================================================
  # Writes search prompts + key events to vdbpromptscollection for video-backend UI.
  vdbpromptscollection: "vss-prompts-events"
  suggestions_max_segments: 48
  suggestions_search_count: 10
  suggestions_events_count: 30
  suggestions_max_events_per_video: 3
  suggestions_lookback_hours: 168
  
  # ============================================================================
  # VIDEO SEGMENTER SETTINGS
  # ============================================================================
  segment_duration: 5
  output_codec: "libx264"
  output_format: "mp4"
  output_bucket_suffix: "-segments"

  # YOLO11 object detector (video-detector)
  yolo_infer_host: ""
  yolo_infer_port: 8022
  # detector_authorization: ""  # optional Bearer token for hosted detector APIs
  yolo_conf: 0.4
  yolo_model: "yolo11s.pt"
  yolo_presign_ttl: 3600
  detection_sidecar_prefix: "detections/"
  detection_store_frames: "true"
